name: Promote pack to prod

# Operators: Actions → Promote pack to prod → confirm = promote
# Rebuilds pack.zip from main and rewrites the `latest` GitHub release tag.
# Does not run on merge. See voidwars-k8s docs/DELIVERY.md

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type promote to publish main pack to tag latest (prod)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'promote'
    runs-on: ubuntu-latest
    steps:
      - name: Clone main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: |
            pack_directory = 'pack'
            output_file_path = '${{ runner.temp }}/pack.zip'
            zip_spec_conformance_level = 'disregard'

      - name: Publish latest (prod)
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: false
          title: "Production pack — ${{ github.sha }}"
          files: |
            ${{ runner.temp }}/pack.zip
