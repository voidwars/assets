name: Build resource pack

# Push/merge to main (pack/**) → GitHub release tag "staging"
# Prod → Actions → Promote pack to prod (tag latest)
# No per-PR zip. Staging and code previews both use the staging URL.

on:
  push:
    branches:
      - main
    paths:
      - "pack/**"
      - ".github/workflows/packsquash.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assets-pack-staging
  cancel-in-progress: true

jobs:
  staging:
    name: Publish staging pack
    runs-on: ubuntu-latest
    steps:
      - name: Clone main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: |
            pack_directory = 'pack'
            output_file_path = '${{ runner.temp }}/pack.zip'
            zip_spec_conformance_level = 'disregard'

      - name: Publish staging release
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: staging
          prerelease: true
          title: "Staging — ${{ github.sha }}"
          files: |
            ${{ runner.temp }}/pack.zip
