name: Build resource pack

# Intended product train (do not bypass):
#   PR open/update (pack changes) → overwrite GitHub release tag "staging"
#   PR merge to main               → overwrite GitHub release tag "latest" (production)
#
# Docs-only PRs do not publish either channel (paths filter).
# Never point production Velocity at the staging URL.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "pack/**"
      - ".github/workflows/packsquash.yml"

permissions:
  contents: write

# Staging tag is singular: only one pack PR should be in flight for QA.
# Cancel superseded staging builds for the same PR; production is per-merge.
concurrency:
  group: assets-pack-${{ github.event.pull_request.number }}-${{ github.event.action == 'closed' && 'prod' || 'staging' }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  staging:
    name: Build and publish staging
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Clone PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: |
            pack_directory = 'pack'
            output_file_path = '${{ runner.temp }}/pack.zip'
            zip_spec_conformance_level = 'disregard'

      - name: Publish staging release
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: staging
          prerelease: true
          title: "Staging — PR #${{ github.event.pull_request.number }}"
          files: |
            ${{ runner.temp }}/pack.zip

  production:
    name: Build and publish production
    # Only on an actual merge. Closed-without-merge does nothing.
    # paths filter already excludes docs-only PRs from this workflow.
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Clone merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: |
            pack_directory = 'pack'
            output_file_path = '${{ runner.temp }}/pack.zip'
            zip_spec_conformance_level = 'disregard'

      - name: Publish production release
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: false
          title: "Production — PR #${{ github.event.pull_request.number }}"
          files: |
            ${{ runner.temp }}/pack.zip
