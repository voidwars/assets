name: Build resource pack

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: true
        default: main
      channel:
        description: Release tag to publish
        required: true
        default: latest
        type: choice
        options:
          - latest
          - staging

permissions:
  contents: write

jobs:
  staging:
    name: Build and publish staging
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Clone PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: |
            pack_directory = 'pack'
            output_file_path = '${{ runner.temp }}/pack.zip'
            zip_spec_conformance_level = 'disregard'

      - name: Publish staging release
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: staging
          prerelease: true
          title: "Staging — PR #${{ github.event.pull_request.number }}"
          files: |
            ${{ runner.temp }}/pack.zip

  production:
    name: Build and publish production
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Clone merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: |
            pack_directory = 'pack'
            output_file_path = '${{ runner.temp }}/pack.zip'
            zip_spec_conformance_level = 'disregard'

      - name: Publish production release
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: false
          title: "Production — PR #${{ github.event.pull_request.number }}"
          files: |
            ${{ runner.temp }}/pack.zip

  manual:
    name: Build and publish (${{ inputs.channel }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Clone ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: |
            pack_directory = 'pack'
            output_file_path = '${{ runner.temp }}/pack.zip'
            zip_spec_conformance_level = 'disregard'

      - name: Publish release
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: ${{ inputs.channel }}
          prerelease: ${{ inputs.channel == 'staging' }}
          title: "${{ inputs.channel == 'latest' && 'Production' || 'Staging' }} — manual (${{ inputs.ref }})"
          files: |
            ${{ runner.temp }}/pack.zip
